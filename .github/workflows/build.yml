name: Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        id: java
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare Android SDK
        id: sdk
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;34.0.0" > /dev/null || true

      - name: Install Gradle 8.9
        id: gradle
        run: |
          curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Build debug APK
        id: build
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace 2>&1 | tee build.log

      - uses: actions/upload-artifact@v4
        with:
          name: island-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish build result to build-log branch
        if: always()
        run: |
          {
            echo "status: ${{ job.status }}"
            echo "steps: java=${{ steps.java.outcome }} sdk=${{ steps.sdk.outcome }} gradle=${{ steps.gradle.outcome }} build=${{ steps.build.outcome }}"
            echo "commit: ${GITHUB_SHA}"
            echo "run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            if [ -f build.log ]; then
              grep -E "^e: |error:|What went wrong|FAILED|Caused by" -A4 build.log | head -n 150 || true
              echo
              echo "---- tail ----"
              tail -n 60 build.log
            fi
          } > /tmp/BUILD_LOG.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan build-log
          git rm -rf . -q
          cp /tmp/BUILD_LOG.txt BUILD_LOG.txt
          git add BUILD_LOG.txt
          git commit -m "Build result for ${GITHUB_SHA}"
          git push -f origin build-log
